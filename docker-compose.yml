services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: finance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finance -d finance']
      interval: 5s
      timeout: 3s
      retries: 10
    command: ['postgres', '-c', 'timezone=Asia/Almaty']

  app:
    build: .
    environment:
      DATABASE_URL: postgres://finance:${POSTGRES_PASSWORD:-finance}@postgres:5432/finance
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      TZ: ${TZ:-Asia/Almaty}
      # За Cloudflare (HTTPS) должен быть true; для локального http — false в .env
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - app
    profiles: ['tunnel'] # стартует только с --profile tunnel

volumes:
  pgdata:
